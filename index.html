<!DOCTYPE html>
<html lang="ja" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>筋トレノート — 予定・記録・分析</title>
<meta name="description" content="筋トレの前・最中・後をまるごと支えるWebアプリ。予定作成、今日のメニュー自動決定、体調に合わせた負荷調整、高速記録、レストタイマー、進捗分析まで。">
<meta name="theme-color" content="#0b0d11" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="筋トレノート">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css?v=1">
</head>
<body>
  <div id="app">
    <header class="appbar" id="appbar">
      <h1 id="appTitle">筋トレノート</h1>
    </header>
    <main id="view"><div class="empty"><div class="empty-icon pulse">🏋️</div></div></main>
  </div>

  <div class="rest-bar" id="restBar">
    <div class="rest-progress" id="restProgress"></div>
    <div class="rest-inner">
      <div class="rest-time mono" id="restTime">0:00</div>
      <div class="grow">
        <div class="tiny faint" id="restLabel">休憩中</div>
        <div class="rest-next" id="restNext"></div>
      </div>
      <button class="icon-btn" id="restMinus" aria-label="15秒減らす">−15</button>
      <button class="icon-btn" id="restPlus" aria-label="15秒増やす">+15</button>
      <button class="btn sm" id="restSkip">終了</button>
    </div>
  </div>

  <nav class="tabbar" id="tabbar">
    <div class="inner">
      <button class="tabbtn" data-tab="home"><span class="ic">🏠</span>ホーム</button>
      <button class="tabbtn" data-tab="session"><span class="ic">📝</span>記録</button>
      <button class="tabbtn" data-tab="plan"><span class="ic">🗓️</span>予定</button>
      <button class="tabbtn" data-tab="stats"><span class="ic">📊</span>分析</button>
      <button class="tabbtn" data-tab="settings"><span class="ic">⚙️</span>設定</button>
    </div>
  </nav>

  <script type="module" src="js/app.js?v=1"></script>
  <noscript>
    <p style="padding:20px">このアプリはJavaScriptが必要です。ブラウザの設定で有効にしてください。</p>
  </noscript>
</body>
</html>
