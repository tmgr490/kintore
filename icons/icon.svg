<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="筋トレノート">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232a3c"/>
      <stop offset="100%" stop-color="#0e1118"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d7cff"/>
      <stop offset="55%" stop-color="#8b7dff"/>
      <stop offset="100%" stop-color="#2fd4a0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- バーベル -->
  <g transform="translate(256 256)">
    <rect x="-178" y="-13" width="356" height="26" rx="13" fill="url(#bar)"/>
    <!-- 内側プレート -->
    <rect x="-150" y="-66" width="42" height="132" rx="17" fill="#eef1f6"/>
    <rect x="108" y="-66" width="42" height="132" rx="17" fill="#eef1f6"/>
    <!-- 外側プレート -->
    <rect x="-196" y="-44" width="34" height="88" rx="14" fill="#9aa3b8"/>
    <rect x="162" y="-44" width="34" height="88" rx="14" fill="#9aa3b8"/>
  </g>

  <!-- 伸びを示す折れ線 -->
  <polyline points="120,392 196,356 258,376 330,308 392,330"
    fill="none" stroke="#2fd4a0" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>
</svg>
